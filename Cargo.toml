[package]
name = "assfonts"
version = "0.1.0"
edition = "2024"

[features]
default = ["cli", "gui"]
cli = ["clap"]
gui = ["slint", "slint-build", "rfd"]

[[bin]]
name = "assfonts_gui"
path = "src/bin/gui.rs"
required-features = ["gui"]


[dependencies]
clap = { version = "4.6.0", features = ["derive"], optional = true }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.18"
walkdir = "2.5.0"
ttf-parser = "0.25.1"
allsorts = "0.16.1"
rayon = "1.10.0"
dashmap = "6.1.0"
color-eyre = "0.6"
slint = { version = "1.15.1", optional = true }
rfd = { version = "0.17.2", optional = true }

[build-dependencies]
slint-build = { version = "1.15.1", optional = true }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
